[package]
name = "myos_runtime"
version = "0.1.0"
edition = "2021"
description = "Minimal host-side inference loop (Phase 1)"

[[bin]]
name = "myos"
path = "src/main.rs"

[dependencies]
model_core = { path = "../model_core" }
# Host-only file map. `model_core` keeps the default `no_std` weight_loader.
weight_loader = { path = "../weight_loader", features = ["host"] }

[dev-dependencies]
safetensors = { version = "0.8", default-features = false }
